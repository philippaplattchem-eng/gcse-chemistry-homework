<style>:root{--pr:#9333ea;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(30,95,180,.10);--sh2:0 6px 24px rgba(30,95,180,.22)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#1a237e,#283593 55%,var(--fl));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}

.score-banner{background:linear-gradient(135deg,#1a237e,#283593 55%,var(--fl));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}

.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}

.submit-btn{background:linear-gradient(135deg,#1a237e,#283593 55%,var(--fl));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(30,95,180,.35);transition:transform .15s,box-shadow .15s}

@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>

<body>
<header class="site-header">
  <a href="combined-paper1.html" class="back-link">&larr; Paper 1 Hub</a>
  <h1>Electrolysis (Topic 4)</h1>

<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Electrolysis application</span>
    <span>Flame: Application</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"A student electrolyses dilute sodium chloride solution and finds oxygen forms at the anode rather than chlorine. Why?","A":"Chloride ions do not move in dilute solution","B":"Oxygen is always produced at the anode regardless of the electrolyte","C":"The dilute solution does not conduct electricity well enough to produce chlorine","D":"In dilute solution, OH⁻ ions from water outnumber Cl⁻ ions, so OH⁻ is preferentially discharged, producing oxygen instead of chlorine","correct":"D","explain":"Which ion is discharged at the anode depends on which is present in greater concentration. In concentrated brine, Cl⁻ ions greatly outnumber OH⁻ ions from water, so Cl⁻ is preferentially discharged and chlorine forms: 2Cl⁻ → Cl₂ + 2e⁻. In dilute NaCl solution, the concentration of Cl⁻ is low and comparable to OH⁻, so OH⁻ is preferentially discharged instead: 4OH⁻ → 2H₂O + O₂ + 4e⁻. This is a key examiner point: concentration determines which ion is discharged. Getting this right in an exam requires you to state which ion is in higher concentration and explain why it is preferentially discharged."},
{"stem":"Copper electrodes replace graphite in the electrolysis of copper sulfate solution. How does this change the anode product and the concentration of the solution?","A":"No change; the electrodes do not affect the products","B":"Hydrogen forms at the cathode instead of copper","C":"The copper anode dissolves into solution, replenishing Cu²⁺ ions; the concentration stays constant","D":"Copper forms at the anode and oxygen forms at the cathode","correct":"C","explain":"With graphite electrodes, the anode is inert: OH⁻ is oxidised to give oxygen gas, and Cu²⁺ ions are removed from solution at the cathode but not replaced. The solution turns pale as Cu²⁺ concentration falls. With copper electrodes, the copper anode itself is oxidised: Cu → Cu²⁺ + 2e⁻. The anode dissolves into solution. At the cathode, Cu²⁺ ions are still reduced to copper: Cu²⁺ + 2e⁻ → Cu. Because copper is added to solution from the dissolving anode at the same rate it is removed at the cathode, the Cu²⁺ concentration stays constant and the blue colour remains unchanged. This is the principle used in industrial copper purification."},
{"stem":"Predict the products at each electrode when molten magnesium chloride (MgCl₂) is electrolysed.","A":"Magnesium at the cathode; oxygen at the anode","B":"Chlorine at the cathode; magnesium at the anode","C":"Hydrogen at the cathode; chlorine at the anode","D":"Magnesium at the cathode; chlorine at the anode","correct":"D","explain":"Molten MgCl₂ contains only Mg²⁺ and Cl⁻ ions. There is no water, so no H⁺ or OH⁻ ions are present. At the cathode (negative electrode): Mg²⁺ ions are attracted and gain 2 electrons: Mg²⁺ + 2e⁻ → Mg. Magnesium metal is produced. At the anode (positive electrode): Cl⁻ ions are attracted and lose electrons: 2Cl⁻ → Cl₂ + 2e⁻. Chlorine gas is produced. The rule for any molten binary ionic compound is straightforward: the metal always forms at the cathode, the non-metal (or non-metal gas) forms at the anode. Hydrogen and oxygen can only appear when water is present."},
{"stem":"What is the half equation for the production of chlorine at the anode during brine electrolysis?","A":"Cl₂ + 2e⁻ → 2Cl⁻","B":"2Cl + 2e⁻ → Cl₂","C":"Cl⁻ + e⁻ → Cl","D":"2Cl⁻ → Cl₂ + 2e⁻","correct":"D","explain":"At the anode, chloride ions are oxidised (lose electrons). The half equation is: 2Cl⁻ → Cl₂ + 2e⁻. Two Cl⁻ ions each lose one electron to form one Cl₂ molecule. Check balance: atoms: 2 Cl on the left, 2 Cl in Cl₂ on the right. Charge: 2- on the left, 2- from 2e⁻ on the right. Balanced. Option A is the reverse reaction (reduction of chlorine to bromide). Option C shows only one Cl⁻ forming Cl₂, which is impossible because Cl₂ contains two chlorine atoms. When writing half equations always check both atom balance and charge balance."},
{"stem":"What is the half equation for oxygen production at the anode during electrolysis of copper sulfate solution?","A":"O₂ + 4e⁻ → 4OH⁻","B":"2H₂O + 4e⁻ → O₂ + 4H⁺","C":"4OH⁻ → 2H₂O + O₂ + 4e⁻","D":"2OH⁻ → O₂ + 2e⁻","correct":"C","explain":"At the anode in CuSO₄ solution, OH⁻ ions from water are oxidised. The half equation is: 4OH⁻ → 2H₂O + O₂ + 4e⁻. Check balance: oxygen: 4 on the left, 2 (in H₂O) + 2 (in O₂) = 4 on the right. Hydrogen: 4 on the left, 4 on the right. Charge: 4- on the left, 0 + 0 + 4- (from 4e⁻) = 4- on the right. Balanced. Option D is not balanced: 2 OH⁻ gives 2 oxygen and 2 hydrogen atoms on the left, but O₂ has no hydrogen atoms on the right. Option A is the reverse reaction."},
{"stem":"During electrolysis of copper sulfate solution with graphite electrodes, what colour change would you observe in the solution?","A":"The solution turns from colourless to blue as copper ions are produced","B":"The solution turns green because sulfate ions become concentrated","C":"No colour change occurs because the ions are not affected","D":"The solution turns from blue to colourless as Cu²⁺ ions are removed from solution","correct":"D","explain":"Copper sulfate solution is blue because of the Cu²⁺ ions it contains. During electrolysis with graphite electrodes, Cu²⁺ ions are continuously removed from solution at the cathode (Cu²⁺ + 2e⁻ → Cu) and not replenished (unlike with copper electrodes). As Cu²⁺ concentration falls, the blue colour gradually fades. If electrolysis continues long enough and all Cu²⁺ is removed, the solution becomes colourless. The remaining liquid is essentially dilute sulfuric acid. Monitoring this colour change in a practical is a good way to confirm that Cu²⁺ ions are being consumed."},
{"stem":"Why is aluminium extracted by electrolysis rather than by reduction with carbon?","A":"Aluminium is too rare to be worth extracting by carbon reduction","B":"Carbon reacts with aluminium to produce an impure, unusable alloy","C":"Aluminium is above carbon in the reactivity series, so carbon cannot reduce aluminium oxide","D":"Aluminium oxide does not melt at the temperature of a blast furnace","correct":"C","explain":"The extraction method for a metal depends on its position in the reactivity series. Metals above carbon (including aluminium, magnesium, and sodium) cannot be reduced by carbon because carbon is not reactive enough to take oxygen away from their oxides. For these metals, electrolysis must be used. Metals below carbon in the reactivity series (such as iron and copper) can be extracted by heating with carbon or carbon monoxide. Because aluminium is above carbon, its extraction requires electrolysis of molten aluminium oxide. This makes aluminium more expensive to produce than iron, despite aluminium being more abundant in the Earth's crust."},
{"stem":"A student electrolyses dilute sulfuric acid and collects gas at each electrode. What gas forms at each electrode and what is the ratio of volumes collected?","A":"Hydrogen at the anode, oxygen at the cathode; ratio 1:2","B":"Oxygen at the anode, hydrogen at the cathode; ratio 1:2","C":"Hydrogen at the anode, chlorine at the cathode; ratio 1:1","D":"Hydrogen at both electrodes; ratio 1:1","correct":"B","explain":"In dilute sulfuric acid, H⁺ ions are reduced at the cathode: 2H⁺ + 2e⁻ → H₂. OH⁻ ions from water are oxidised at the anode: 4OH⁻ → 2H₂O + O₂ + 4e⁻. The overall reaction is the electrolysis of water: 2H₂O → 2H₂ + O₂. For every mole of O₂ produced, 2 moles of H₂ are produced. So the volume of hydrogen is twice the volume of oxygen: ratio O₂:H₂ = 1:2. In the apparatus, the tube over the cathode fills twice as fast as the tube over the anode. This 1:2 ratio of O₂ to H₂ is a useful experimental check."},
{"stem":"What happens to the concentration of copper sulfate solution when graphite electrodes are used, compared to when copper electrodes are used?","A":"With graphite, the concentration increases. With copper, it stays the same","B":"With graphite, the concentration decreases as Cu²⁺ is consumed but not replaced. With copper, the concentration stays constant as the copper anode dissolves and replenishes Cu²⁺","C":"With both types of electrode, the concentration decreases at the same rate","D":"With copper electrodes, the concentration increases because the anode dissolves","correct":"B","explain":"With graphite (inert) electrodes: Cu²⁺ ions deposit at the cathode (Cu²⁺ + 2e⁻ → Cu) but the graphite anode produces oxygen rather than copper. Cu²⁺ ions are removed from solution and not replaced, so the concentration decreases and the blue colour fades. With copper electrodes: the copper anode oxidises and dissolves (Cu → Cu²⁺ + 2e⁻), releasing Cu²⁺ ions into solution at the same rate they are deposited at the cathode. The concentration stays constant. This is important in industrial copper refining: impure copper is used as the anode and pure copper deposits at the cathode, while the electrolyte concentration stays stable."},
{"stem":"Predict the products at each electrode when molten potassium iodide (KI) is electrolysed.","A":"Potassium at the cathode; oxygen at the anode","B":"Iodine at the cathode; potassium at the anode","C":"Hydrogen at the cathode; iodine at the anode","D":"Potassium at the cathode; iodine at the anode","correct":"D","explain":"Molten KI contains only K⁺ and I⁻ ions. There is no water, so no H⁺ or OH⁻ ions are present. At the cathode: K⁺ + e⁻ → K. Potassium metal is produced. At the anode: 2I⁻ → I₂ + 2e⁻. Iodine is produced (it appears as a dark solid or purple vapour). This follows the general rule for molten binary ionic compounds: metal at cathode, non-metal at anode. Option C (hydrogen) would only be correct if water were present. Option B has the electrodes swapped: potassium is a metal so it forms at the cathode, not the anode."},
{"stem":"In brine electrolysis, why must the Cl₂ and NaOH products be kept separate?","A":"NaOH would block the electrodes and stop chlorine forming","B":"Cl₂ and NaOH react together to form bleach, contaminating both products","C":"The mixture would explode","D":"Chlorine dissolves in sodium hydroxide and reduces its concentration without reacting","correct":"B","explain":"Chlorine gas reacts readily with sodium hydroxide solution: Cl₂ + 2NaOH → NaCl + NaOCl + H₂O. This produces sodium chlorate(I) (also known as bleach). In industry, bleach can be made deliberately by mixing the two products. However, if Cl₂ and NaOH are allowed to mix inside the electrolysis cell, neither product is obtained in a pure form. Industrial brine electrolysis uses a membrane or diaphragm to separate the anode compartment (where Cl₂ forms) from the cathode compartment (where H₂ forms and NaOH accumulates), keeping the products from reacting with each other."},
{"stem":"During electrolysis of brine, both Na⁺ and H⁺ ions are present at the cathode. Which is discharged and why?","A":"Na⁺ because it is present in greater concentration","B":"Both are discharged equally, producing a sodium-hydrogen mixture","C":"H⁺ because sodium is too reactive to be deposited from aqueous solution","D":"Na⁺ because it has a larger charge and is more strongly attracted to the cathode","correct":"C","explain":"In aqueous solutions, metals high in the reactivity series (sodium, potassium, calcium) are never deposited at the cathode because H⁺ ions from water are always preferentially discharged instead. Sodium is very high in the reactivity series, meaning Na⁺ ions hold their electrons very tightly and are very difficult to reduce in aqueous conditions. H⁺ ions, which are easier to discharge, are reduced instead: 2H⁺ + 2e⁻ → H₂. The rule is: if a metal is above hydrogen in the reactivity series, hydrogen gas forms at the cathode rather than the metal. Sodium metal would only form if molten NaCl (no water) were electrolysed."},
{"stem":"A student predicts that sodium will form at the cathode and sulfate will form at the anode during electrolysis of sodium sulfate solution. Identify the errors in this prediction.","A":"Both predictions are correct","B":"Sodium is correct at the cathode, but oxygen forms at the anode instead of sulfate","C":"Both predictions are wrong: hydrogen forms at the cathode and oxygen forms at the anode","D":"Only the cathode prediction is wrong: hydrogen is correct at the cathode and sulfate is correct at the anode","correct":"C","explain":"Two errors are present. At the cathode: sodium will not form because sodium is above hydrogen in the reactivity series and Na⁺ ions are not discharged from aqueous solution. Instead H⁺ ions are preferentially discharged: 2H⁺ + 2e⁻ → H₂. Hydrogen gas forms. At the anode: sulfate ions (SO₄²⁻) are very stable and not discharged under normal conditions. Instead OH⁻ from water is oxidised: 4OH⁻ → 2H₂O + O₂ + 4e⁻. Oxygen forms. Both products effectively come from the water, not the sodium sulfate. This means the electrolysis of sodium sulfate is essentially the electrolysis of water."},
{"stem":"State one industrial use for each of the three products of brine electrolysis.","A":"Chlorine: fertiliser; hydrogen: water treatment; sodium hydroxide: fuel","B":"Chlorine: making bleach or PVC plastic; hydrogen: used as a fuel or in the Haber process; sodium hydroxide: making soap or paper","C":"Chlorine: food preservative; hydrogen: making bleach; sodium hydroxide: making plastics","D":"Chlorine: rocket fuel; hydrogen: making acid; sodium hydroxide: making cement","correct":"B","explain":"The three products of brine electrolysis each have major industrial uses. Chlorine: used to make bleach (sodium chlorate(I), which is a disinfectant), to manufacture PVC plastic, and to disinfect drinking water. Hydrogen: used as a fuel (e.g. in hydrogen fuel cells), and as a reactant in the Haber process to make ammonia (which is used to make fertilisers). Sodium hydroxide: used to make soap (reacts with oils and fats in a process called saponification), to make paper (breaks down wood pulp), and to make bleach (reacts with chlorine). This trio of products makes brine electrolysis one of the most industrially important chemical processes."},
{"stem":"Explain why the carbon anodes in the industrial extraction of aluminium need to be replaced regularly.","A":"Carbon conducts electricity better when new, so it must be replaced as it ages","B":"Aluminium deposits on the carbon anode and must be scraped off regularly","C":"The carbon dissolves in the molten cryolite and contaminates the aluminium","D":"The carbon anode reacts with oxygen produced at the anode and gradually burns away as CO₂","correct":"D","explain":"In aluminium extraction, Al₂O₃ is dissolved in molten cryolite and electrolysed at around 950°C. At the cathode: Al³⁺ + 3e⁻ → Al. Molten aluminium is produced. At the carbon anode: O²⁻ ions are oxidised to produce oxygen gas: 2O²⁻ → O₂ + 4e⁻. However, at the very high temperature of the cell, the oxygen produced immediately reacts with the carbon anode: C + O₂ → CO₂. The carbon is gradually burned away as CO₂ gas. This means the carbon anodes must be replaced regularly, adding significantly to the cost of aluminium production. Research is ongoing into the development of non-reactive (inert) anode materials to reduce this cost."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent application!':pct>=60?'Good application skills. Review the questions you missed.':'Keep working on applying your knowledge. Read each explanation carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
