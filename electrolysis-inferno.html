<style>:root{--pr:#9333ea;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(13,53,117,.12);--sh2:0 6px 24px rgba(13,53,117,.28)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#060f2e,#0d1f5c 55%,var(--inf));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}

.score-banner{background:linear-gradient(135deg,#060f2e,#0d1f5c 55%,var(--inf));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}

<body>
<header class="site-header">

  <h1>Electrolysis (Topic 4)</h1>
  <span class="tier-badge">Inferno</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Electrolysis exam challenge</span>
    <span>Inferno: Exam Challenge</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"A student electrolyses a solution and finds oxygen forms at the anode rather than chlorine. What can be concluded about the solution?","A":"The solution must be molten, not aqueous","B":"The student must have connected the electrodes the wrong way round","C":"The solution is either dilute or contains no chloride ions at all","D":"The solution must contain copper ions, which prevent chlorine forming","correct":"C","explain":"Chlorine forms at the anode only when Cl⁻ ions are present at high concentration (as in concentrated brine). When oxygen forms instead, two explanations are possible. First: the solution contains no chloride ions at all (e.g. copper sulfate or sodium sulfate), in which case OH⁻ from water is the only anion available and is oxidised to give oxygen. Second: the solution contains Cl⁻ but at low concentration, so OH⁻ is preferentially discharged. A full exam answer should consider both possibilities. Examiner reports note that many students state only one reason and do not recognise that concentration and ion identity both matter."},
{"stem":"During electrolysis of copper sulfate solution with graphite electrodes, the pH of the solution gradually decreases. Explain why in terms of what happens at each electrode.","A":"Chlorine gas dissolves in the solution and makes it acidic","B":"H⁺ ions are produced at the anode as OH⁻ is oxidised, increasing H⁺ concentration","C":"Cu²⁺ ions make the solution more acidic as they accumulate","D":"Sulfate ions react with water to produce a weak acid","correct":"B","explain":"Two processes combine to lower the pH. At the cathode, Cu²⁺ ions are removed from solution (Cu²⁺ + 2e⁻ → Cu), but this does not directly affect pH. At the anode, OH⁻ ions are oxidised: 4OH⁻ → 2H₂O + O₂ + 4e⁻. This removes OH⁻ from solution and produces H⁺ (equivalently written as: 2H₂O → O₂ + 4H⁺ + 4e⁻). As OH⁻ is consumed and H⁺ concentration rises, the pH falls. At the end, when all Cu²⁺ has been deposited and all OH⁻ consumed, the remaining solution is essentially dilute sulfuric acid. This is confirmed by the solution turning colourless and having a low pH.","higher":true},
{"stem":"Compare the products of electrolysis of molten sodium chloride and aqueous sodium chloride solution (concentrated).","A":"Both produce sodium at the cathode and chlorine at the anode","B":"Both produce hydrogen at the cathode. Molten NaCl gives oxygen at the anode; aqueous gives chlorine","C":"The products are identical because both contain Na⁺ and Cl⁻ ions","D":"Molten NaCl gives sodium and chlorine. Concentrated aqueous NaCl gives hydrogen and chlorine","correct":"D","explain":"Molten NaCl contains only Na⁺ and Cl⁻ ions. With no water present: cathode gives sodium metal (Na⁺ + e⁻ → Na); anode gives chlorine gas (2Cl⁻ → Cl₂ + 2e⁻). Concentrated aqueous NaCl also contains H⁺ and OH⁻ from water. At the cathode: Na⁺ is not discharged because sodium is above hydrogen in the reactivity series. H⁺ is preferentially discharged: 2H⁺ + 2e⁻ → H₂. At the anode: concentrated Cl⁻ is preferentially discharged (high concentration): 2Cl⁻ → Cl₂ + 2e⁻. So chlorine still forms at the anode in concentrated solution, but the cathode product changes from sodium to hydrogen because water is present. This comparison is a classic exam question."},
{"stem":"Write the half equations for both electrodes in brine electrolysis and state whether each is oxidation or reduction.","A":"Cathode: 2Cl⁻ → Cl₂ + 2e⁻ (oxidation); Anode: 2H⁺ + 2e⁻ → H₂ (reduction)","B":"Cathode: 2H⁺ + 2e⁻ → H₂ (reduction); Anode: 2Cl⁻ → Cl₂ + 2e⁻ (oxidation)","C":"Cathode: Na⁺ + e⁻ → Na (reduction); Anode: 2Cl⁻ → Cl₂ + 2e⁻ (oxidation)","D":"Cathode: 2H⁺ + 2e⁻ → H₂ (oxidation); Anode: 2Cl⁻ → Cl₂ + 2e⁻ (reduction)","correct":"B","explain":"At the cathode (negative electrode): H⁺ ions gain electrons and are reduced. Half equation: 2H⁺ + 2e⁻ → H₂. This is reduction (gain of electrons). At the anode (positive electrode): Cl⁻ ions lose electrons and are oxidised. Half equation: 2Cl⁻ → Cl₂ + 2e⁻. This is oxidation (loss of electrons). Check both: cathode: charge 2+ + 2- = 0 each side. Anode: charge 2- on left = 2- from 2e⁻ on right. Both balanced. Option A has the electrodes swapped. Option D has the correct half equations but the labels oxidation and reduction are reversed. In the exam, always state which is oxidation and which is reduction for full marks.","higher":true},
{"stem":"A student wants to copper-plate a steel spoon. Describe the correct setup: which electrode is the spoon, what material the other electrode should be, and what electrolyte should be used.","A":"Spoon as anode; graphite cathode; dilute sulfuric acid","B":"Spoon as cathode; graphite anode; copper sulfate solution","C":"Spoon as cathode; copper anode; copper sulfate solution","D":"Spoon as anode; copper cathode; sodium chloride solution","correct":"C","explain":"To electroplate an object with copper: the object (the steel spoon) is made the cathode (negative electrode), where Cu²⁺ ions are reduced to deposit copper: Cu²⁺ + 2e⁻ → Cu. The anode is made of copper. The copper anode is oxidised and dissolves: Cu → Cu²⁺ + 2e⁻. This replenishes Cu²⁺ ions in solution at the same rate they are deposited at the cathode, so the electrolyte concentration stays constant. The electrolyte is copper sulfate solution, which supplies the Cu²⁺ ions. Option B uses graphite as the anode: copper would still deposit on the spoon initially, but Cu²⁺ concentration would fall over time because it is not being replaced. The coating would become thinner and the solution would fade."},
{"stem":"A student says 'in electrolysis, positive ions move to the cathode because the electrons at the cathode repel them away from the anode.' Evaluate this explanation.","A":"Correct; electron repulsion causes positive ions to move to the cathode","B":"Partially correct; ions are repelled by the anode but not attracted to the cathode","C":"Incorrect: positive ions are attracted to the cathode because opposite charges attract, not because they are repelled by electrons","D":"Correct; the dense concentration of electrons at the cathode attracts positive ions","correct":"C","explain":"The student's explanation contains a fundamental error. Positive ions do not move away from electrons by repulsion. They are attracted to the cathode because the cathode carries a negative charge (connected to the negative terminal of the power supply) and opposite charges attract. This is electrostatic attraction, not repulsion. It is the same principle as opposite poles of magnets attracting. The correct explanation is: the cathode is negatively charged; positive ions (cations) are attracted to it by electrostatic attraction; they move through the electrolyte, discharge at the surface, and are reduced. Examiner reports note that confusing attraction with repulsion is a common error, particularly in 'explain' questions worth 3 or more marks."},
{"stem":"Calculate the number of moles of electrons transferred when 0.05 mol of Cu²⁺ ions are completely discharged at the cathode.","A":"0.05 mol electrons","B":"0.025 mol electrons","C":"0.2 mol electrons","D":"0.1 mol electrons","correct":"D","explain":"The half equation for copper deposition is: Cu²⁺ + 2e⁻ → Cu. The mole ratio is 1 mol Cu²⁺ to 2 mol electrons. For 0.05 mol Cu²⁺: moles of electrons = 0.05 × 2 = 0.1 mol. This uses the same stoichiometric reasoning as any other mole ratio calculation. The key step is identifying the mole ratio from the half equation. The charge on the ion also tells you directly how many electrons are needed: Cu²⁺ has a 2+ charge, so 2 electrons are needed per ion. For Al³⁺ (charge 3+), 3 electrons per ion would be needed. Always use the balanced half equation rather than guessing.","higher":true},
{"stem":"Explain, using the concept of selective discharge, why industrial chlorine production requires concentrated brine rather than dilute sodium chloride solution.","A":"Concentrated brine has a higher density, allowing chlorine to separate from the solution more easily","B":"Concentrated brine conducts electricity better, producing more chlorine per second","C":"Concentrated brine contains more Na⁺ ions, which stabilise the chlorine gas as it forms","D":"In dilute brine, OH⁻ ions from water outnumber Cl⁻ ions at the anode, so oxygen is produced instead of chlorine","correct":"D","explain":"The product at the anode depends on which negative ion is present at the highest concentration. In dilute sodium chloride solution, the concentration of Cl⁻ is low and comparable to OH⁻ from water, so OH⁻ is preferentially discharged: 4OH⁻ → 2H₂O + O₂ + 4e⁻. Oxygen would form instead of chlorine. In concentrated brine, Cl⁻ ions greatly outnumber OH⁻ ions, so Cl⁻ is preferentially discharged: 2Cl⁻ → Cl₂ + 2e⁻. Chlorine is produced. A full exam answer should explicitly state the relative concentrations of OH⁻ and Cl⁻ and explain how this determines which is discharged. Simply writing 'more Cl⁻ ions' without explaining selective discharge will not score all available marks.","higher":true},
{"stem":"Predict and explain what happens at each electrode if electrolysis of copper sulfate solution with graphite electrodes continues until the solution becomes colourless.","A":"Electrolysis stops because there are no more ions to carry charge","B":"Copper starts forming at the anode once all Cu²⁺ is depleted","C":"Sulfate ions begin to be discharged at the anode once Cu²⁺ is gone","D":"Hydrogen forms at the cathode and oxygen continues at the anode, as H⁺ from water is now the only positive ion discharged","correct":"D","explain":"Initially, Cu²⁺ ions are preferentially discharged at the cathode. As electrolysis continues, Cu²⁺ is removed from solution and not replaced (graphite anode is inert). The solution fades from blue to colourless when all Cu²⁺ is gone. At this point, H⁺ ions from water are the only positive ions available at the cathode and begin to be discharged: 2H⁺ + 2e⁻ → H₂. Hydrogen gas forms at the cathode. At the anode, oxygen continues to form from OH⁻: 4OH⁻ → 2H₂O + O₂ + 4e⁻. The remaining solution is essentially dilute sulfuric acid. Electrolysis does not stop because H⁺ and OH⁻ from water are always present as charge carriers."},
{"stem":"Molten calcium chloride (CaCl₂) is electrolysed. Write the half equations for both electrodes.","A":"Cathode: 2Ca²⁺ + 4e⁻ → Ca; Anode: Cl₂ + 2e⁻ → 2Cl⁻","B":"Cathode: 2H⁺ + 2e⁻ → H₂; Anode: 2Cl⁻ → Cl₂ + 2e⁻","C":"Cathode: Ca²⁺ + 2e⁻ → Ca; Anode: 2Cl⁻ → Cl₂ + 2e⁻","D":"Cathode: Ca + 2e⁻ → Ca²⁺; Anode: Cl₂ + 2e⁻ → 2Cl⁻","correct":"C","explain":"Molten CaCl₂ contains only Ca²⁺ and Cl⁻ ions. No water is present, so no H⁺ or OH⁻. At the cathode: Ca²⁺ + 2e⁻ → Ca. Calcium metal is produced. Check balance: charge: 2+ + 2- = 0 each side. Atom: 1 Ca each side. At the anode: 2Cl⁻ → Cl₂ + 2e⁻. Chlorine gas is produced. Check balance: charge: 2- on left, 2- from 2e⁻ on right. Atom: 2 Cl each side. Option B would be correct for aqueous calcium chloride (water present, so H⁺ discharged at cathode instead of Ca²⁺). Always check whether the question specifies molten or aqueous. Option A has cathode and anode half equations reversed.","higher":true},
{"stem":"Evaluate this student answer: 'In brine electrolysis, sodium hydroxide is produced because sodium ions collect at the anode and react with hydroxide ions that form there.'","A":"The answer is fully correct","B":"The answer has one error: sodium ions collect at the cathode, not the anode","C":"The answer has two errors: sodium ions are attracted to the cathode, not the anode; and hydroxide ions do not form at the anode. They remain in solution after H⁺ is discharged at the cathode and Cl⁻ is discharged at the anode","D":"The answer is partially correct: hydroxide forms at the anode but sodium is not involved","correct":"C","explain":"Two errors are present. Error 1: Na⁺ ions are positive cations and are attracted to the cathode (negative electrode), not the anode (positive electrode). Like charges repel and opposite charges attract. Error 2: OH⁻ ions do not form at the anode. At the anode, Cl⁻ ions are discharged to give chlorine gas: 2Cl⁻ → Cl₂ + 2e⁻. At the cathode, H⁺ ions are discharged to give hydrogen: 2H⁺ + 2e⁻ → H₂. The Na⁺ and OH⁻ ions that were not discharged remain in solution and together form sodium hydroxide. NaOH forms in the body of the solution, not at either electrode. Examiner reports flag both of these errors as common in 6-mark questions on electrolysis."},
{"stem":"A student electrolyses sodium sulfate solution (Na₂SO₄). Predict the products at each electrode and write a half equation for each.","A":"Cathode: Na⁺ + e⁻ → Na; Anode: SO₄²⁻ → SO₃ + O²⁻","B":"Cathode: 2H⁺ + 2e⁻ → H₂; Anode: 4OH⁻ → 2H₂O + O₂ + 4e⁻","C":"Cathode: 2H⁺ + 2e⁻ → H₂; Anode: 2SO₄²⁻ → S₂O₈²⁻ + 2e⁻","D":"Cathode: Na⁺ + e⁻ → Na; Anode: 4OH⁻ → 2H₂O + O₂ + 4e⁻","correct":"B","explain":"Na₂SO₄ solution contains Na⁺, SO₄²⁻, H⁺, and OH⁻. At the cathode: Na⁺ is not discharged (sodium is above hydrogen in the reactivity series and is not reduced from aqueous solution). H⁺ is preferentially discharged: 2H⁺ + 2e⁻ → H₂. Hydrogen forms. At the anode: SO₄²⁻ is very stable and not discharged. OH⁻ is preferentially discharged: 4OH⁻ → 2H₂O + O₂ + 4e⁻. Oxygen forms. Both products come from water, not from the sodium sulfate itself. The overall process is the electrolysis of water: 2H₂O → 2H₂ + O₂. The sodium sulfate merely acts as the charge carrier (electrolyte) to allow current to flow. Option D correctly identifies the anode product but incorrectly states sodium forms at the cathode.","higher":true},
{"stem":"Explain the difference in cathode product when molten sodium chloride is electrolysed compared to 1 mol/dm³ sodium chloride solution.","A":"Hydrogen forms at the cathode in both cases because hydrogen is always preferentially discharged","B":"Molten NaCl gives sodium at the cathode; aqueous NaCl gives hydrogen because H⁺ ions from water are preferentially discharged over Na⁺","C":"Sodium forms at the cathode in both cases","D":"Molten NaCl gives chlorine at the cathode; aqueous NaCl gives oxygen at the cathode","correct":"B","explain":"In molten NaCl: the only positive ion is Na⁺. There is no water, so no H⁺ is present. Na⁺ ions are discharged at the cathode: Na⁺ + e⁻ → Na. Sodium metal is the cathode product. In 1 mol/dm³ NaCl solution: both Na⁺ and H⁺ (from water) are present. Sodium is very high in the reactivity series, so Na⁺ ions are very difficult to reduce in aqueous conditions and are not discharged. H⁺ ions are preferentially discharged instead: 2H⁺ + 2e⁻ → H₂. Hydrogen gas is the cathode product. The presence of water fundamentally changes the cathode product whenever the metal involved is above hydrogen in the reactivity series. This is why electrolysis of molten, not aqueous, compounds is used to extract very reactive metals such as sodium and aluminium."},
{"stem":"In the industrial extraction of aluminium, write the half equation for aluminium production at the cathode and explain the charge on the aluminium ion.","A":"Al²⁺ + 2e⁻ → Al; aluminium is in Group 2 and loses 2 electrons","B":"Al⁺ + e⁻ → Al; aluminium loses 1 electron because it is in Period 3","C":"Al³⁺ + 3e⁻ → Al; aluminium is in Group 3 and loses 3 electrons to form a 3+ ion","D":"2Al³⁺ + 6e⁻ → 2Al; aluminium always forms in pairs","correct":"C","explain":"At the cathode: Al³⁺ + 3e⁻ → Al. Aluminium is in Group 3 of the periodic table, so it loses 3 electrons when forming an ion, giving a 3+ charge. Each Al³⁺ ion must gain 3 electrons to be reduced to a neutral aluminium atom. Check the half equation: charge: 3+ + 3- = 0 on the left, 0 on the right. Atom: 1 Al each side. Balanced. Option D (2Al³⁺ + 6e⁻ → 2Al) is also correctly balanced but is not the simplest form; the question asks for the half equation which is conventionally written for one formula unit. Options A and B are wrong because they give incorrect charges on the aluminium ion. The charge on a metal ion is determined by its group number.","higher":true},
{"stem":"A student claims: 'Using a higher concentration of CuSO₄ solution in the core practical would increase the rate of copper deposition at the cathode.' Is this claim correct?","A":"No; concentration has no effect on electrolysis because the current is controlled by the power supply","B":"No; higher concentration would cause more oxygen to form at the cathode instead of copper","C":"Yes; a higher concentration of Cu²⁺ ions means more ions arrive at the cathode per second, increasing the rate of deposition for a given current","D":"Yes; higher concentration increases the voltage across the cell and this increases the rate of deposition","correct":"C","explain":"The claim is correct in principle. A higher concentration of Cu²⁺ in solution means a greater supply of Cu²⁺ ions available to be discharged at the cathode. This increases the probability that Cu²⁺ ions arrive at the cathode surface and are reduced: Cu²⁺ + 2e⁻ → Cu. For a given current (and therefore a given rate of electron supply), increasing the concentration ensures the cathode surface has a ready supply of Cu²⁺, preventing the rate being limited by ion availability. Option A is partially true in that the current is set by the power supply, but concentration does affect the efficiency of deposition. Option D is wrong: concentration does not directly increase the voltage. In practice, the rate of deposition is primarily controlled by the current flowing through the circuit."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    var hb=q.higher?'<span class="higher-badge">Higher</span>':'';
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span>'+hb+'<span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Outstanding. Exam-ready on electrolysis.':pct>=60?'Strong performance. Revisit the questions you missed.':'Electrolysis is challenging. Work through each explanation carefully and retry.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
