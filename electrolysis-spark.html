<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electrolysis Spark | Combined Science Chemistry</title>
<style>:root{--pr:#9333ea;--sp:#5b9bd5;--fl:#1e5fb4;--inf:#0d3575;--bg:#f4f6fb;--card:#fff;--tx:#1c1f3a;--txm:#6b7280;--bdr:#dde1f0;--cok:#e8f5e9;--cob:#2e7d32;--wng:#ffebee;--wnb:#c62828;--r:14px;--sh:0 2px 10px rgba(147,51,234,.10);--sh2:0 6px 24px rgba(147,51,234,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh}
.site-header{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;gap:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.site-header h1{font-size:1rem;font-weight:600;flex:1}
.back-link{color:rgba(255,255,255,.82);text-decoration:none;font-size:.84rem;white-space:nowrap;border:1px solid rgba(255,255,255,.35);padding:.25rem .7rem;border-radius:20px;transition:background .15s}
.back-link:hover{background:rgba(255,255,255,.15);color:#fff}
.tier-badge{font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:20px;white-space:nowrap;color:#fff;letter-spacing:.03em;background:var(--sp)}
main{max-width:820px;margin:0 auto;padding:1.5rem 1rem 4rem}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;margin-bottom:1.2rem;border-bottom:2px solid var(--bdr);color:var(--txm);font-size:.87rem}
.score-banner{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;margin-bottom:1.5rem;text-align:center;display:none;box-shadow:var(--sh2)}
.score-banner h2{font-size:2rem;font-weight:800}.score-banner p{opacity:.88;margin-top:.3rem;font-size:.97rem}
.question-card{background:var(--card);border:2px solid var(--bdr);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1rem;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.question-card.correct{border-color:var(--cob);background:var(--cok);box-shadow:none}
.question-card.wrong{border-color:var(--wnb);background:var(--wng);box-shadow:none}
.q-header{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.8rem}
.q-num{background:var(--pr);color:#fff;font-weight:700;font-size:.72rem;padding:.2rem .5rem;border-radius:6px;white-space:nowrap;flex-shrink:0;margin-top:.12rem}
.q-stem{font-size:.97rem;line-height:1.6}
.options{display:flex;flex-direction:column;gap:.35rem;margin-left:2.6rem}
.opt-lbl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.4rem .6rem;border-radius:8px;transition:background .12s;font-size:.91rem;border:1px solid transparent}
.opt-lbl:hover{background:#f0f2ff;border-color:var(--bdr)}
.opt-lbl input{margin-top:.22rem;flex-shrink:0;accent-color:var(--pr)}
.opt-lbl.hl-ok{background:var(--cok);border-color:var(--cob);font-weight:600;color:var(--cob)}
.opt-lbl.hl-bad{background:var(--wng);border-color:var(--wnb);color:var(--wnb)}
.res-icon{display:none;font-size:.93rem;font-weight:700;margin:.5rem 0 0 2.6rem;padding:.25rem .6rem;border-radius:6px}
.res-ok{color:var(--cob);background:#d4edda}.res-bad{color:var(--wnb);background:#fde8e8}
.explain-box{display:none;margin:.7rem 0 0 2.6rem;padding:.7rem 1rem;background:#f0f2ff;border-left:4px solid var(--pr);border-radius:0 8px 8px 0;font-size:.87rem;line-height:1.65;color:#374151}
.explain-lbl{font-weight:700;color:var(--pr);margin-bottom:.2rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.submit-area{margin-top:2rem;text-align:center}
.submit-btn{background:linear-gradient(135deg,#4a1d96,#6d28d9 50%,var(--pr));color:#fff;border:none;padding:.85rem 2.8rem;border-radius:10px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(147,51,234,.35);transition:transform .15s,box-shadow .15s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.45)}
.submit-btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
@media(max-width:480px){.site-header h1{font-size:.88rem}.options{margin-left:1.5rem}.explain-box{margin-left:1.5rem}}</style>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <a href="combined-paper1.html" class="back-link">&larr; Paper 1 Hub</a>
  <h1>Electrolysis (Topic 4)</h1>
  <span class="tier-badge">Spark</span>
</header>
<main>
  <div class="quiz-meta">
    <span>15 questions &middot; Electrolysis recall</span>
    <span>Spark: Recall</span>
  </div>
  <div id="score-banner" class="score-banner"></div>
  <div id="questions"></div>
  <div class="submit-area">
    <button id="submit-btn" class="submit-btn">Submit All Answers</button>
  </div>
</main>
<script>
const QUESTIONS=[
{"stem":"The cathode in an electrolysis cell is...","A":"The positive electrode where oxidation occurs","B":"The positive electrode where reduction occurs","C":"The negative electrode where reduction occurs","D":"The negative electrode where oxidation occurs","correct":"C","explain":"The cathode is the negative electrode. Positive ions (cations) are attracted to it because opposite charges attract. At the cathode, those positive ions gain electrons and are reduced. A useful memory link: CAThode attracts CATions. At the anode (positive electrode), negative ions lose electrons and are oxidised. A very common exam error is swapping cathode and anode, especially when stating which is positive and which is negative."},
{"stem":"Which of the following can be used as an electrolyte?","A":"Solid sodium chloride","B":"Pure water with no dissolved salts","C":"Molten sodium chloride","D":"Liquid mercury","correct":"C","explain":"An electrolyte must contain ions that are free to move and carry charge. Molten sodium chloride works because the Na⁺ and Cl⁻ ions are freed from the solid lattice when it melts and can move through the liquid. Solid sodium chloride (option A) has ions but they are held fixed in the lattice and cannot move. Pure water (option B) contains very few ions and is a very poor conductor. Electrolysis requires either a molten ionic compound or an ionic compound dissolved in water."},
{"stem":"During electrolysis of molten lead bromide (PbBr₂), which product forms at the cathode?","A":"Bromine gas","B":"Lead metal","C":"Oxygen gas","D":"Hydrogen gas","correct":"B","explain":"Molten lead bromide contains Pb²⁺ and Br⁻ ions. The cathode is the negative electrode, so positive Pb²⁺ ions are attracted to it. At the cathode, Pb²⁺ ions gain 2 electrons and are reduced to lead metal: Pb²⁺ + 2e⁻ → Pb. You can observe a shiny liquid collecting at the cathode. At the anode, Br⁻ ions are attracted and lose electrons to form bromine gas. No oxygen or hydrogen forms because there is no water in a molten compound."},
{"stem":"During electrolysis of molten lead bromide (PbBr₂), which product forms at the anode?","A":"Lead metal","B":"Oxygen gas","C":"Hydrogen gas","D":"Bromine gas","correct":"D","explain":"The anode is the positive electrode, so negative Br⁻ ions are attracted to it. At the anode, two Br⁻ ions each lose one electron and are oxidised to form bromine gas: 2Br⁻ → Br₂ + 2e⁻. Bromine appears as a reddish-brown gas. No oxygen or hydrogen forms because there is no water present in a molten compound. Oxygen and hydrogen only appear when water (or an aqueous solution) is the electrolyte."},
{"stem":"What does the term 'reduction' mean in electrolysis?","A":"The loss of electrons at the anode","B":"The movement of negative ions towards the cathode","C":"The breakdown of the ionic compound by heat","D":"The gain of electrons at the cathode","correct":"D","explain":"Reduction is the gain of electrons and it always takes place at the cathode (negative electrode) in electrolysis. A helpful mnemonic is OIL RIG: Oxidation Is Loss of electrons; Reduction Is Gain of electrons. For example, when copper ions are reduced: Cu²⁺ + 2e⁻ → Cu. The Cu²⁺ ion gains 2 electrons and becomes a neutral copper atom. Oxidation (loss of electrons) happens at the anode. Getting OIL RIG the right way round is essential for half equation questions."},
{"stem":"During electrolysis of copper sulfate solution using graphite electrodes, what forms at the cathode?","A":"Oxygen gas","B":"Hydrogen gas","C":"Sulfur","D":"Copper metal","correct":"D","explain":"The cathode is the negative electrode. In copper sulfate solution, both Cu²⁺ ions (from the dissolved salt) and H⁺ ions (from water) are present. Cu²⁺ ions are preferentially discharged because copper is below hydrogen in the reactivity series. At the cathode: Cu²⁺ + 2e⁻ → Cu. A reddish-brown layer of copper metal builds up on the cathode surface. Hydrogen only forms at the cathode when no metal ions are present (for example in dilute sulfuric acid). If you see copper sulfate in the question, copper is always the cathode product."},
{"stem":"During electrolysis of copper sulfate solution using graphite electrodes, what forms at the anode?","A":"Copper metal","B":"Chlorine gas","C":"Oxygen gas","D":"Sulfur dioxide","correct":"C","explain":"The anode is the positive electrode. In copper sulfate solution, the negative ions are SO₄²⁻ and OH⁻ (from water). Sulfate ions are very stable and are not discharged under normal conditions. Instead, OH⁻ ions from water are oxidised at the anode: 4OH⁻ → 2H₂O + O₂ + 4e⁻. Oxygen gas is produced. Chlorine would only form if chloride ions (Cl⁻) were present in the solution. There are no chloride ions in copper sulfate."},
{"stem":"What are the three products of the electrolysis of concentrated sodium chloride solution (brine)?","A":"Sodium metal, chlorine gas, and water","B":"Hydrogen gas, oxygen gas, and sodium chloride","C":"Chlorine gas, hydrogen gas, and sodium hydroxide solution","D":"Sodium metal, bromine gas, and water","correct":"C","explain":"The three products of brine electrolysis are: chlorine gas at the anode, hydrogen gas at the cathode, and sodium hydroxide solution remaining in the electrolyte. Sodium metal does not form because H⁺ ions from water are preferentially discharged at the cathode rather than Na⁺ ions. This is because sodium is very reactive and high in the reactivity series. All three products are extremely important industrially: chlorine is used in bleach and plastics; hydrogen is used as a fuel; sodium hydroxide is used to make soap and paper."},
{"stem":"In brine electrolysis, which gas forms at the anode?","A":"Hydrogen gas","B":"Oxygen gas","C":"Sodium vapour","D":"Chlorine gas","correct":"D","explain":"The anode is the positive electrode, which attracts negative ions. In concentrated brine, Cl⁻ ions are present in very high concentration alongside OH⁻ from water. Because Cl⁻ greatly outnumbers OH⁻, Cl⁻ ions are preferentially discharged: 2Cl⁻ → Cl₂ + 2e⁻. Chlorine gas is produced at the anode. In dilute sodium chloride solution, OH⁻ ions would be discharged instead and oxygen would form. The concentration of the brine is therefore critical to getting the right product."},
{"stem":"In brine electrolysis, which gas forms at the cathode?","A":"Chlorine gas","B":"Oxygen gas","C":"Sodium vapour","D":"Hydrogen gas","correct":"D","explain":"The cathode is the negative electrode, which attracts positive ions. In brine, positive ions present are Na⁺ (from the salt) and H⁺ (from water). Sodium is very reactive and very high in the reactivity series, so Na⁺ ions are not discharged from aqueous solution. Instead, H⁺ ions from water are preferentially discharged: 2H⁺ + 2e⁻ → H₂. Hydrogen gas is produced at the cathode. Sodium metal would only form if molten sodium chloride (with no water present) were electrolysed instead."},
{"stem":"After brine electrolysis, what solution remains in the electrolyte?","A":"Dilute hydrochloric acid","B":"Sodium carbonate solution","C":"Sodium hydroxide solution","D":"Pure water","correct":"C","explain":"During brine electrolysis, Cl⁻ ions are removed at the anode (forming Cl₂) and H⁺ ions are removed at the cathode (forming H₂). The ions left behind in solution are Na⁺ and OH⁻. These combine to form sodium hydroxide (NaOH) solution. Sodium hydroxide is a very important industrial alkali used to make soap, paper, and bleach. The removal of H⁺ from the solution means the pH rises, confirming the solution becomes alkaline."},
{"stem":"During electrolysis of copper sulfate solution with graphite electrodes, what happens to the mass of the cathode?","A":"It decreases as copper dissolves from the cathode","B":"It stays the same because copper is neither gained nor lost","C":"It increases as copper metal is deposited on its surface","D":"It decreases as oxygen gas is produced there","correct":"C","explain":"Cu²⁺ ions in solution are attracted to the negative cathode and gain electrons: Cu²⁺ + 2e⁻ → Cu. Copper metal deposits as a growing layer on the cathode surface, so the mass of the cathode increases. You can see this happening as the cathode turns from dark graphite to reddish-brown copper during the experiment. This principle is used in electroplating, where a thin layer of metal is deposited onto an object by making it the cathode."},
{"stem":"What is the half equation for the deposition of copper at the cathode?","A":"Cu → Cu²⁺ + 2e⁻","B":"Cu²⁺ + 2e⁻ → Cu","C":"Cu + 2e⁻ → Cu²⁺","D":"2Cu⁺ + 2e⁻ → 2Cu","correct":"B","explain":"At the cathode, Cu²⁺ ions gain electrons (are reduced) to form neutral copper atoms. The half equation is: Cu²⁺ + 2e⁻ → Cu. Check the balance: charge on left = 2+ + 2- = 0. Charge on right = 0. Balanced. Option A is the reverse reaction (oxidation of copper at a copper anode). Always check that charge balances in a half equation: add up the charges on each side and make sure they are equal."},
{"stem":"During electrolysis, positive ions in the electrolyte move towards the cathode. Why?","A":"The cathode releases electrons which push positive ions towards it","B":"Positive ions are attracted to the negative cathode because opposite charges attract","C":"Positive ions move away from the anode because they are the same charge","D":"Positive ions are neutral and drift randomly until they reach an electrode","correct":"B","explain":"Positive ions move to the cathode because of electrostatic attraction: opposite charges attract each other. The cathode carries a negative charge (connected to the negative terminal of the power supply) and positive ions carry a positive charge. This is the same principle as opposite poles of a magnet attracting each other. Negative ions (anions) move in the opposite direction, towards the positive anode. The movement of ions through the electrolyte is what carries the electrical current."},
{"stem":"What is the half equation for the formation of bromine at the anode during electrolysis of molten lead bromide?","A":"Br₂ + 2e⁻ → 2Br⁻","B":"2Br⁻ + 2e⁻ → Br₂","C":"Br⁻ → Br₂ + e⁻","D":"2Br⁻ → Br₂ + 2e⁻","correct":"D","explain":"At the anode, Br⁻ ions are oxidised (lose electrons) to form bromine molecules. Two Br⁻ ions each lose one electron: 2Br⁻ → Br₂ + 2e⁻. The electrons released flow through the external circuit. Check the balance: atoms: 2 Br on left, 2 Br in Br₂ on right. Charge: 2- on left, 2- from 2e⁻ on right. Balanced. Option A is the reverse (reduction of bromine). Option C is wrong because one Br⁻ cannot produce a Br₂ molecule on its own: Br₂ needs two bromine atoms."}
];
function renderQuiz(){
  var c=document.getElementById('questions');
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var div=document.createElement('div');
    div.className='question-card';div.id='qcard-'+n;
    var opts=['A','B','C','D'].map(function(l){
      return '<label class="opt-lbl" id="opt-'+n+'-'+l+'"><input type="radio" name="q'+n+'" value="'+l+'"> <span><strong>'+l+'.</strong> '+q[l]+'</span></label>';
    }).join('');
    div.innerHTML='<div class="q-header"><span class="q-num">Q'+n+'</span><span class="q-stem">'+q.stem+'</span></div>'
      +'<div class="options">'+opts+'</div>'
      +'<div class="res-icon" id="res-'+n+'"></div>'
      +'<div class="explain-box" id="ex-'+n+'"><div class="explain-lbl">Explanation</div>'+q.explain+'</div>';
    c.appendChild(div);
  });
}
function submitQuiz(){
  var unanswered=[];
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    if(!document.querySelector('input[name="q'+n+'"]:checked'))unanswered.push(n);
  });
  if(unanswered.length>0&&!confirm(unanswered.length+' question(s) not answered. Submit anyway?'))return;
  var score=0,total=QUESTIONS.length;
  QUESTIONS.forEach(function(q,idx){
    var n=idx+1;
    var sel=document.querySelector('input[name="q'+n+'"]:checked');
    var card=document.getElementById('qcard-'+n);
    var res=document.getElementById('res-'+n);
    var ex=document.getElementById('ex-'+n);
    ['A','B','C','D'].forEach(function(l){
      var lbl=document.getElementById('opt-'+n+'-'+l);
      lbl.style.pointerEvents='none';
      if(l===q.correct)lbl.classList.add('hl-ok');
      else if(sel&&sel.value===l)lbl.classList.add('hl-bad');
    });
    if(sel&&sel.value===q.correct){score++;card.classList.add('correct');res.className='res-icon res-ok';res.textContent='✓ Correct';res.style.display='inline-block';}
    else{card.classList.add('wrong');res.className='res-icon res-bad';res.textContent=sel?'✗ Incorrect':'Not answered';res.style.display='inline-block';}
    ex.style.display='block';
  });
  var banner=document.getElementById('score-banner');
  var pct=Math.round(score/total*100);
  banner.innerHTML='<h2>'+score+' / '+total+'</h2><p>'+pct+'%: '+(pct>=80?'Excellent recall!':pct>=60?'Good. Review the questions you missed.':'Keep practising. Read the explanations below carefully.')+'</p>';
  banner.style.display='block';
  document.getElementById('submit-btn').disabled=true;
  banner.scrollIntoView({behavior:'smooth',block:'center'});
}
renderQuiz();
document.getElementById('submit-btn').addEventListener('click',submitQuiz);
</script>
</body>
</html>
